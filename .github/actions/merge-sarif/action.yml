name: Merge SARIF files
description: >
  Merge the per-translation-unit SARIF files written by `scan-build -sarif`
  into a single SARIF run, as GitHub code scanning accepts one run per tool.

inputs:
  input-dir:
    description: Directory searched (recursively) for *.sarif files.
    required: true
  output:
    description: Path of the merged SARIF file to write.
    required: true

runs:
  using: composite
  steps:
    - name: Merge SARIF files
      shell: bash
      env:
        INPUT_DIR: ${{ inputs.input-dir }}
        OUTPUT: ${{ inputs.output }}
      run: |
        set -e
        find "$INPUT_DIR" -name '*.sarif' -print0 | xargs -0 jq -s '
          [.[].runs[]] as $runs
          | {
              "$schema": .[0]["$schema"],
              version: "2.1.0",
              runs: [($runs[0] | del(.artifacts)) + {
                tool: {driver: ($runs[0].tool.driver + {
                  rules: ([$runs[].tool.driver.rules[]?] | unique_by(.id))
                })},
                results: [$runs[].results[]? | del(.ruleIndex)
                  | walk(if type == "object" and has("uri")
                         then del(.index) else . end)]
              }]
            }' > "$OUTPUT"
        jq -e '.runs | length == 1' "$OUTPUT" > /dev/null
        echo "Merged $(jq '.runs[0].results | length' "$OUTPUT") result(s) into $OUTPUT"
