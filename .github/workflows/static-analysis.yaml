# Reusable static analysis workflow for NetSurf projects.
#
# Runs CodeQL and clang scan-build over a native `make`, uploading both to
# GitHub code scanning.
#
# Usage, from a project's .github/workflows/static-analysis.yaml:
#
#   name: "Static Analysis"
#   on: [push]
#   jobs:
#     static-analysis:
#       permissions:
#         contents: read
#         security-events: write
#       uses: netsurf-browser/ci-tools/.github/workflows/static-analysis.yaml@master
#       # with:
#       #   extra-packages: libjson-c-dev
#       #   make-tools: true
#       #   env-sh: docs/env.sh
#
# ccache is deliberately not used: a cache hit skips the compiler, so CodeQL
# and scan-build would not see that file. CCACHE is set empty because some
# Makefiles (e.g. netsurf's) otherwise wrap the compiler with ccache if found.

name: "Static Analysis"

on:
  workflow_call:
    inputs:
      extra-packages:
        description: Extra apt packages the project needs, whitespace separated.
        type: string
        default: ''
      make-tools:
        description: Also build the host tools (e.g. nsgenbind) before the deps.
        type: boolean
        default: false
      env-sh:
        description: Use this env.sh from the repo instead of netsurf's (e.g. docs/env.sh).
        type: string
        default: ''

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-22.04

    env:
      TARGET_WORKSPACE: "${{ github.workspace }}/projects"
      CCACHE: ""  # Never use ccache, even if installed (see above).

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Setup
      uses: netsurf-browser/ci-tools/.github/actions/setup@master
      with:
        extra-packages: ${{ inputs.extra-packages }}
        make-tools: ${{ inputs.make-tools }}
        env-sh: ${{ inputs.env-sh }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: cpp

    - name: Build
      run: |
          source projects/env.sh || exit 1
          make -j"$(nproc)"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  scan-build:
    name: scan-build
    runs-on: ubuntu-22.04

    env:
      TARGET_WORKSPACE: "${{ github.workspace }}/projects"
      CCACHE: ""  # Never use ccache, even if installed (see above).

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Setup
      uses: netsurf-browser/ci-tools/.github/actions/setup@master
      with:
        extra-packages: clang-tools jq ${{ inputs.extra-packages }}
        make-tools: ${{ inputs.make-tools }}
        env-sh: ${{ inputs.env-sh }}

    - name: scan-build
      run: |
          source projects/env.sh || exit 1
          scan-build -sarif --keep-empty -o sarif make -j"$(nproc)"

    - name: Merge SARIF files
      uses: netsurf-browser/ci-tools/.github/actions/merge-sarif@master
      with:
        input-dir: sarif
        output: scan-build.sarif

    - name: Upload scan-build SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: scan-build.sarif
        category: scan-build
